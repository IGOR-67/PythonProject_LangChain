[project]
name = "pythonproject-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IGOR-67", email = "ya.m67@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-gigachat>=0.5.1",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
pythonproject-langchain = "pythonproject_langchain:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
